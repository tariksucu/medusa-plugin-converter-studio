name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

# Cancel in-progress runs for the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # Dependencies' install scripts are not needed to check, test or build.
      - name: Install dependencies
        run: 'npm ci --ignore-scripts'

      - name: Type check (server, tests, admin)
        run: 'npm run typecheck'

      # Unit tests with a mocked API: no network, no API key.
      - name: Run tests
        run: 'npm test'

      - name: Build
        run: 'npm run build'
